version: "3.9"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-demo:local
    container_name: devops-demo
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
